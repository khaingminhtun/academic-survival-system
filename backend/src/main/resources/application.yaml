spring:
  application:
    name: academic-survival-system

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/academic_survival_system}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

    properties:
      hibernate:
        format_sql: false

server:
  port: 8081