spring:
  application:
    name: academic-survival-system

  datasource:
    url: jdbc:h2:mem:academicsurvivaldb
    driver-class-name: org.h2.Driver
    username: student
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: 8081